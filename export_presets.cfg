; Export presets for Shadow Castle: STEM Detective.
;
; Committed on purpose: the CI web build and any second machine need the same
; preset, and "Web" here must match the name passed to --export-release exactly.
;
; Godot rewrites this file whenever Project > Export is touched, filling in
; every default it did not find. Opening that dialog once after pulling is the
; quickest way to confirm the engine agrees with what is written below.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, docs/*, prototypes/*, *.md, *.py, *.provenance.md, assets/backgrounds/chemistry_room_bg.png, assets/backgrounds/hall_map_hub_v2.png, assets/backgrounds/hall_walls_open_v3.png, assets/backgrounds/hall_walls_routes_open_v4.png, assets/backgrounds/hall_walls_routes_open_v5_doors.png, assets/characters/animated_pixel_v3/butler_walk.png, assets/characters/animated_pixel_v3/castle_guardian_walk.png, assets/sprites/6f193acb-9c4c-4871-b0ca-0ed862dbce74.png, assets/sprites/d7162b4e-abfb-42ea-94dc-ed56227625bb.png, assets/sprites/player/6f193acb-9c4c-4871-b0ca-0ed862dbce74.png, assets/sprites/player/7eb048d2-d640-4f5b-a09d-3200c14d8b60.png, assets/sprites/player/805c5ac0-ff3e-4429-a43a-68435d9d8038.png, assets/sprites/player/909a9afc-c911-4435-b76a-1c32042cf1c8.png, assets/sprites/player/a99e54c8-ef9c-4bef-869a-fe70da669b8a.png, assets/sprites/player/d7162b4e-abfb-42ea-94dc-ed56227625bb.png, assets/sprites/player/detective_sprite_sheet_transparent_fixed.png, assets/sprites/player/fd675f0b-93bc-4576-87d9-b5ba400831d2.png, assets/sprites/player/idle_v3_walking_north.png, assets/sprites/player/pixellab_walk.png, assets/sprites/player/student_detective_walk.png, assets/ui/alchemy/alchemy_workbench.png, assets/ui/alchemy/recipe_list_frame.png, assets/ui/alchemy/recipe_list_frame_cropped.png, assets/ui/frames/menu_empty_frame.png, assets/ui/frames/menu_purple_frame.png, assets/ui/frames/menu_wood_frame.png, assets/ui/keyhub/magic_panel_frame.png, assets/ui/keyhub/wood_frame.png, assets/ui/maps/circuit_room_repair_base.png, assets/ui/panels/button_states/0e08a956-92be-44a2-b5e3-b2960916aabc.png, assets/ui/panels/button_states/3af6561c-6304-44df-88c2-975447a4fafd.png, assets/ui/panels/button_states/5f9a8724-dea8-43ec-b908-e2729cf31462.png, assets/ui/panels/button_states/a7e6a2db-b70c-4787-be4a-b4f1b514f786.png, assets/ui/panels/button_states/button_disabled.png, assets/ui/panels/button_states/button_hover.png, assets/ui/panels/button_states/button_normal.png, assets/ui/panels/button_states/button_pressed.png, assets/ui/ui_note_listitem_hover.png, assets/ui/ui_note_listitem_normal.png, assets/ui/ui_note_listitem_selected.png, assets/ui/ui_note_listitem_selected_trim.png, assets/ui/ui_note_scrollbar_thumb.png"
