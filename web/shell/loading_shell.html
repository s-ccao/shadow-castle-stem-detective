<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0b0912">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
	/*
	   自绘的加载层。
	
	   底图就是游戏自己的标题画面，暗罩之后压上一块和游戏里同款的档案面板：
	   加载屏和加载完之后的菜单是同一幅画，所以交接的那一下不是“换了个界面”，
	   而是这块面板活了过来。
	
	   整屏不引任何外部字体或图片，底图直接内嵌在样式表末尾。这一屏必须在网络
	   还在搬 130MB 的时候就已经画好，任何一个额外请求都是在拖它后腿；而且不
	   依赖外部资源，本地起服务或离线打开时它长得一模一样。
	*/
	:root {
		--paper: oklch(9% 0.016 284);
		--ink: oklch(94% 0.018 80);
		--muted: oklch(66% 0.02 282);
		--accent: oklch(78% 0.15 76);
		--brass: oklch(58% 0.10 68);
		--arcane: oklch(68% 0.13 300);
		--mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
	}

	html, body, #canvas { margin: 0; padding: 0; border: 0; }

	body {
		background: var(--paper);
		color: var(--ink);
		overflow: hidden;
		touch-action: none;
		-webkit-tap-highlight-color: transparent;
	}

	#canvas { display: block; }
	#canvas:focus { outline: none; }

	#boot {
		position: fixed;
		inset: 0;
		z-index: 10;
		overflow: hidden;
		background: #000;
		display: grid;
		place-items: center;
		opacity: 1;
		transition: opacity 700ms cubic-bezier(0.7, 0, 0.84, 0);
	}
	#boot.done { opacity: 0; pointer-events: none; }

	/* 引擎会把 1024x768 等比居中、两侧留黑，这一层照抄同一个框。画面因此
	   在交接的那一帧完全不动 —— 玩家看到的不是“换了个界面”，而是同一块
	   档案板上的字变了。 */
	.stage {
		position: relative;
		width: min(100vw, calc(100vh * 4 / 3));
		height: min(100vh, calc(100vw * 3 / 4));
		overflow: hidden;
	}

	/* 城堡书房：游戏打开时看到的正是这一幅。 */
	.bg {
		position: absolute;
		inset: 0;
		background-position: center;
		background-size: 100% 100%;
		filter: brightness(0.70) saturate(1.05);
	}

	/* 开场就是一场暴雨，窗外该有闪电。间隔很长，才不会变成频闪灯。 */
	.storm {
		position: absolute;
		inset: 0;
		background: linear-gradient(180deg,
			oklch(86% 0.05 265 / 0.5) 0%,
			oklch(80% 0.06 280 / 0.16) 34%,
			transparent 62%);
		opacity: 0;
		mix-blend-mode: screen;
		animation: bolt 13s ease-out infinite;
	}
	@keyframes bolt {
		0%, 6%, 100% { opacity: 0; }
		1.2%  { opacity: 0.85; }
		2.0%  { opacity: 0.12; }
		2.8%  { opacity: 0.62; }
		4.4%  { opacity: 0.05; }
	}

	.vignette {
		position: absolute;
		inset: 0;
		background:
			radial-gradient(115% 78% at 50% 34%, transparent 30%, oklch(6% 0.014 284 / 0.72) 100%),
			linear-gradient(180deg, transparent 40%, oklch(6% 0.014 284 / 0.86) 100%);
	}

	.scan {
		position: absolute;
		inset: 0;
		pointer-events: none;
		background: repeating-linear-gradient(to bottom,
			oklch(100% 0 0 / 0.022) 0px, oklch(100% 0 0 / 0.022) 1px,
			transparent 1px, transparent 3px);
		mix-blend-mode: overlay;
	}

	/* 档案面板。用的是游戏里那块 case intake 的比例、配色和圆角。 */
	/* 位置与宽度取自游戏里那块 case intake 面板的实际几何（设计坐标
	   322,440 380x297，视口 1024x768），所以淡出之后真面板就落在原地。 */
	.plate {
		position: absolute;
		left: 31.45%;
		top: 57.33%;
		width: 37.11%;
		box-sizing: border-box;
		padding: 3.2% 3.6% 3.6%;
		border: 2px solid oklch(52% 0.09 66 / 0.92);
		border-radius: 6px;
		background: oklch(12% 0.03 40 / 0.95);
		box-shadow: 0 18px 46px oklch(4% 0.01 284 / 0.75), inset 0 0 0 1px oklch(30% 0.05 60 / 0.5);
		animation: settle 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
	}
	@keyframes settle {
		from { opacity: 0; transform: translateY(14px) scale(0.985); }
		to   { opacity: 1; transform: translateY(0) scale(1); }
	}

	.kicker {
		font-family: var(--mono);
		font-size: clamp(0.5rem, 1.5vw, 0.6rem);
		letter-spacing: 0.28em;
		color: oklch(62% 0.03 60);
		margin-bottom: 9px;
	}

	.phase {
		font-family: var(--mono);
		font-size: clamp(0.66rem, 2vw, 0.82rem);
		letter-spacing: 0.14em;
		color: var(--ink);
		min-height: 1.3em;
		margin-bottom: 12px;
	}

	/* 分段刻度：比一根实心条更像仪器，也更容易一眼看出还剩多少。 */
	.meter { display: flex; gap: 3px; height: 7px; margin-bottom: 10px; }
	.meter i {
		flex: 1;
		border-radius: 1px;
		background: oklch(26% 0.02 60);
		transition: background 160ms linear, box-shadow 160ms linear;
	}
	.meter i.on { background: var(--accent); box-shadow: 0 0 9px oklch(78% 0.15 76 / 0.5); }
	.meter i.edge { background: oklch(92% 0.12 82); box-shadow: 0 0 15px oklch(84% 0.17 78 / 0.9); }

	.foot {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		font-family: var(--mono);
		font-variant-numeric: tabular-nums;
	}
	.bytes { font-size: clamp(0.52rem, 1.6vw, 0.64rem); letter-spacing: 0.1em; color: var(--muted); }
	.pct {
		font-size: clamp(0.95rem, 3vw, 1.3rem);
		font-weight: 600;
		color: var(--accent);
		text-shadow: 0 0 16px oklch(78% 0.15 76 / 0.35);
	}

	.note {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
		bottom: 1.2%;
		width: min(92vw, 46ch);
		text-align: center;
		font-family: var(--mono);
		font-size: clamp(0.48rem, 1.4vw, 0.58rem);
		line-height: 1.6;
		letter-spacing: 0.05em;
		color: oklch(56% 0.02 282);
	}

	#notice {
		display: none;
		position: absolute;
		left: 50%;
		top: 50%;
		transform: translate(-50%, -50%);
		font-family: var(--mono);
		font-size: 0.76rem;
		line-height: 1.65;
		color: oklch(80% 0.16 28);
		border: 1px solid oklch(46% 0.14 28);
		background: oklch(14% 0.05 28 / 0.94);
		border-radius: 6px;
		padding: 16px 18px;
		max-width: 44ch;
		white-space: pre-wrap;
	}
	#boot.failed .plate, #boot.failed .note { display: none; }
	#boot.failed #notice { display: block; }

	@media (prefers-reduced-motion: reduce) {
		.storm, .plate { animation: none; }
		#boot { transition: none; }
	}

	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

window.shadowCastleUpdate = (function () {
	let waitingWorker = null;
	let snoozedUntil = 0;

	return {
		setWaiting: function (worker) {
			waitingWorker = worker;
			snoozedUntil = 0;
		},
		isReady: function () {
			return Boolean(waitingWorker && Date.now() >= snoozedUntil);
		},
		snooze: function (milliseconds) {
			snoozedUntil = Date.now() + Math.max(0, Number(milliseconds) || 0);
		},
		activate: function () {
			if (!waitingWorker) { return false; }
			navigator.serviceWorker.addEventListener('controllerchange', function () {
				window.location.reload();
			}, { once: true });
			waitingWorker.postMessage('claim');
			return true;
		},
	};
}());

(function () {
	const boot = document.getElementById('boot');
	const notice = document.getElementById('notice');
	const phaseEl = document.getElementById('phase');
	const bytesEl = document.getElementById('bytes');
	const meterEl = document.getElementById('meter');
	const pctEl = document.getElementById('pct');
	const noteEl = document.getElementById('note');
	const kickerEl = document.getElementById('kicker');

	const zh = (navigator.language || '').toLowerCase().startsWith('zh');

	// 阶段文案跟着真实进度走。最后一段是留给 wasm 编译的：那一步会占住主线程，
	// 动画必然卡住，所以要先说清楚在干什么，卡住才不像崩了。
	const PHASES = zh ? [
		[0.00, '正在接入档案库'],
		[0.06, '解密案卷 · 阿什福德停电案'],
		[0.24, '绘制城堡平面'],
		[0.44, '校准提灯光学'],
		[0.61, '配置现场试剂'],
		[0.77, '编目知识之锁'],
		[0.91, '守卫开始苏醒'],
		[1.00, '正在点灯'],
	] : [
		[0.00, 'CONNECTING TO THE ARCHIVE'],
		[0.06, 'DECRYPTING CASE FILE · ASHFORD BLACKOUT'],
		[0.24, 'MAPPING THE CASTLE FLOORPLAN'],
		[0.44, 'CALIBRATING LANTERN OPTICS'],
		[0.61, 'SYNTHESISING FIELD REAGENTS'],
		[0.77, 'INDEXING THE KNOWLEDGE LOCKS'],
		[0.91, 'THE GUARDIAN STIRS'],
		[1.00, 'LIGHTING THE LAMPS'],
	];

	if (zh) { kickerEl.textContent = '案件受理  /  阿什福德庄园'; }

	const SEGMENTS = 26;
	const segs = [];
	for (let i = 0; i < SEGMENTS; i++) {
		const s = document.createElement('i');
		meterEl.appendChild(s);
		segs.push(s);
	}

	let totalBytes = 0;
	try {
		const sizes = GODOT_CONFIG['fileSizes'] || {};
		for (const k in sizes) { totalBytes += sizes[k]; }
	} catch (e) { totalBytes = 0; }

	function mb(n) { return (n / 1048576).toFixed(1); }

	noteEl.textContent = zh
		? '首次载入约 ' + (totalBytes ? mb(totalBytes) : '130') + ' MB，之后由本机缓存，再进来会快很多，断网也能玩。'
		: 'First load is about ' + (totalBytes ? mb(totalBytes) : '130')
			+ ' MB. It is cached on this device afterwards, and plays offline.';

	let shown = 0;     // 平滑后的进度，用来画
	let target = 0;    // onProgress 报来的真实进度
	let settled = false;
	let phaseText = '';
	let lit = -1;

	function setPhase(p) {
		let t = PHASES[0][1];
		for (let i = 0; i < PHASES.length; i++) {
			if (p >= PHASES[i][0]) { t = PHASES[i][1]; }
		}
		if (t !== phaseText) { phaseText = t; phaseEl.textContent = t; }
	}

	function paint() {
		const count = Math.round(shown * SEGMENTS);
		if (count !== lit) {
			lit = count;
			for (let i = 0; i < SEGMENTS; i++) {
				segs[i].className = i < count ? (i === count - 1 ? 'on edge' : 'on') : '';
			}
		}
		pctEl.textContent = Math.round(shown * 100) + '%';
		setPhase(shown);
	}

	let raf = 0;
	function frame() {
		// 只做指数逼近：网络进度是跳变的，直接画会一格一格顿。
		shown += (target - shown) * 0.10;
		if (settled) { shown += (1 - shown) * 0.18; }
		paint();
		raf = requestAnimationFrame(frame);
	}

	setPhase(0);
	bytesEl.textContent = zh ? '等待响应…' : 'AWAITING RESPONSE';
	raf = requestAnimationFrame(frame);

	function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

	function fail(err) {
		console.error(err);
		stop();
		let msg;
		if (err instanceof Error) { msg = err.message; } else if (typeof err === 'string') { msg = err; } else {
			msg = zh ? '发生了未知错误。' : 'An unknown error occurred.';
		}
		notice.textContent = (zh ? '无法启动\n\n' : 'Could not start\n\n') + msg;
		boot.classList.add('failed');
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	// Service worker 默认是在 startGame 结束之后才注册的，也就是说第一次那
	// 130MB 是在它存在之前就下完的，一个字节都没进缓存 —— 玩家要来第三次才
	// 享受得到。这里先注册再接管，第一次下载就顺手存下来，第二次进来就是本地
	// 读取，断网也能开。
	//
	// 只在“从来没装过”的那一次接管。已经有旧缓存时贸然让新 worker 上位，会
	// 出现页面还是旧的 index.js、资源却换成了新 pck 的错配；那种情况按浏览器
	// 默认的节奏走，下次进来自然就是新版。
	// Service worker 是缓存优先的，所以一旦装上，玩家拿到的永远是缓存里那一版。
	// 新版本会在后台悄悄装好、然后停在 waiting，直到用旧版的标签页全部关掉才
	// 换代 —— 玩家没有任何理由知道自己该去关标签页，于是发出去的修复对他们
	// 等于不存在。
	//
	// 新 worker 下载完整后交给游戏内 UpdateNotice。它会暂停整个场景树，并让
	// 玩家选择立即重启或稍后再说；只有明确选择重启才会发送 claim。
	function prepareServiceWorker() {
		return new Promise(function (resolve) {
			if (!GODOT_CONFIG['serviceWorker'] || !('serviceWorker' in navigator)) {
				resolve(false);
				return;
			}

			let settled = false;
			const finish = function () {
				if (!settled) { settled = true; resolve(false); }
			};
			// 注册出问题也不能把开局卡在这里。
			const escape = setTimeout(function () { finish(false); }, 3000);

			navigator.serviceWorker.register(GODOT_CONFIG['serviceWorker']).then(function (reg) {
				const publishUpdate = function (worker) {
					if (!worker) { return; }
					window.shadowCastleUpdate.setWaiting(worker);
				};

				if (reg.waiting) { publishUpdate(reg.waiting); }

				reg.addEventListener('updatefound', function () {
					const installing = reg.installing;
					if (!installing) { return; }
					installing.addEventListener('statechange', function () {
						if (installing.state === 'installed' && navigator.serviceWorker.controller) {
							publishUpdate(installing);
						}
					});
				});

				// 已经被接管、又没有新版本在等 —— 正常开局。
				if (navigator.serviceWorker.controller) { clearTimeout(escape); finish(); return; }

				// 从来没装过的那一次：先接管当前页，第一次下载的 130MB 才会进缓存。
				// 不这样做的话，第一次是在 worker 存在之前下完的，一个字节都留不下。
				const sw = reg.installing || reg.active;
				if (!sw) { clearTimeout(escape); finish(false); return; }
				navigator.serviceWorker.addEventListener('controllerchange', function () {
					clearTimeout(escape);
					finish();
				}, { once: true });
				const claim = function () {
					if (sw.state === 'activated') { sw.postMessage('claim'); }
				};
				claim();
				sw.addEventListener('statechange', claim);
			}).catch(function (err) {
				console.warn('Service worker unavailable:', err);
				clearTimeout(escape);
				finish();
			});
		});
	}

	function launch() {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					target = Math.min(current / total, 1);
					bytesEl.textContent = mb(current) + ' / ' + mb(total) + ' MB';
				} else if (totalBytes > 0) {
					bytesEl.textContent = (zh ? '正在取回 ' : 'FETCHING ') + mb(totalBytes) + ' MB';
				}
			},
		}).then(function () {
			settled = true;
			target = 1;
			// 让最后那一格补满被看见，再淡出 —— 底下就是同一幅画的真菜单。
			setTimeout(function () {
				boot.classList.add('done');
				setTimeout(function () { stop(); boot.remove(); }, 780);
			}, 300);
		}, fail);
	}

	if (missing.length !== 0) {
		fail((zh
			? '这个浏览器缺少运行所需的功能：\n'
			: 'This browser is missing features required to run the game:\n') + missing.join('\n'));
	} else {
		prepareServiceWorker().then(launch, launch);
	}
}());
	</script>
</body>
</html>
