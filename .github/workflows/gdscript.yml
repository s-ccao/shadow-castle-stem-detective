name: GDScript

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      # A syntax error means the project will not open in Godot at all, so
      # this is the check that must never be allowed to fail.
      - name: Parse every script
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r file; do
            if ! gdparse "$file" >/dev/null 2>&1; then
              echo "::error file=$file::gdparse failed"
              gdparse "$file" || true
              failed=1
            fi
          done < <(find scripts autoload -name '*.gd' | sort)
          exit "$failed"

      # gdparse only proves a file is syntactically well-formed. Godot rejects
      # more than that at load time -- duplicate dictionary keys, duplicate
      # top-level definitions, res:// paths whose target was deleted -- and a
      # merge is very good at producing all three. Those failures only show up
      # when you press Play, so they are checked here instead.
      - name: Check for load-time errors gdparse misses
        run: python3 tools/check_static.py

      # case_script_zh.gd is excluded: it is a translation table whose lines
      # are long because sentences are long, so max-line-length says nothing
      # useful about it and would drown the real signal as it grows.
      #
      # gdlint reports a large number of pre-existing style issues, almost all
      # of them max-line-length and class-definitions-order in the largest room
      # scripts. Failing on any of them would make this job permanently red and
      # therefore ignored, so the count is pinned instead: new code must not add
      # to it. The baseline rose from 760 when the two development lines were
      # merged and the larger versions of game_world.gd, circuit_lab_ui.gd and
      # library_light_lab_ui.gd came in with their existing warnings.
      - name: Lint against the recorded baseline
        env:
          BASELINE: "1064"
        run: |
          set -uo pipefail
          total=0
          while IFS= read -r file; do
            count=$(gdlint "$file" 2>&1 | grep -c 'Error:' || true)
            total=$((total + count))
          done < <(find scripts autoload -name '*.gd' \
                   -not -name 'case_script_zh.gd' | sort)
          echo "gdlint problems: $total (baseline $BASELINE)"
          if [ "$total" -gt "$BASELINE" ]; then
            echo "::error::gdlint problems rose from $BASELINE to $total."
            echo "Fix the new warnings, or lower the baseline if you removed some."
            exit 1
          fi
          if [ "$total" -lt "$BASELINE" ]; then
            echo "::notice::gdlint problems dropped to $total."
            echo "Lower BASELINE in .github/workflows/gdscript.yml to lock the win in."
          fi

      # project.godot lists every autoload by path; a rename that misses one
      # produces a project that boots straight into an error screen.
      - name: Check autoload paths resolve
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r path; do
            file="${path#res://}"
            if [ ! -f "$file" ]; then
              echo "::error file=project.godot::autoload target missing: $path"
              failed=1
            fi
          done < <(sed -n '/^\[autoload\]/,/^\[/p' project.godot \
                   | grep -o 'res://[^"]*' || true)
          exit "$failed"

      # A translation whose format specifiers or BBCode drift from the English
      # crashes or misrenders at runtime, and one whose English was reworded
      # silently stops being used. Coverage itself is reported, never gated --
      # translating is incremental.
      - name: Check translations
        run: python3 tools/check_translations.py
